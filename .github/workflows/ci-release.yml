name: Prüfen und veröffentlichen

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Optional: vollständiger SHA eines Commits aus main zur Wiederholung'
        required: false
        type: string

permissions:
  contents: read

# queue: max bewahrt bis zu 100 wartende Läufe. Standard-Concurrency würde
# bei mehreren schnellen Pushes den älteren wartenden Lauf verwerfen.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main-release' }}
  queue: max
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'
  NODE_VERSION: '22'

jobs:
  plan:
    name: Quellstand und Version
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Manuellen Zielstand prüfen
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [ -n "$REQUESTED_REVISION" ]; then
            [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Release planen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 scripts/release.py plan --preview
          else
            python3 scripts/release.py plan
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  verify:
    name: Tests und Analyse
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tests für Web, Versionen und Pakete
        run: |
          node --test webos/test/*.test.cjs
          python3 -m unittest discover -s scripts/tests -v
      - name: JavaScript für ältere TV-Browser prüfen
        run: |
          npm install --prefix "$RUNNER_TEMP/ipflix-syntax" --no-save --ignore-scripts acorn@8.15.0
          export NODE_PATH="$RUNNER_TEMP/ipflix-syntax/node_modules"
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const acorn = require('acorn');
          function check(directory) {
            for (const entry of fs.readdirSync(directory, {withFileTypes: true})) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) check(file);
              else if (file.endsWith('.js')) {
                acorn.parse(fs.readFileSync(file, 'utf8'), {ecmaVersion: 2016});
                console.log('ES2016:', file);
              }
            }
          }
          check('webos/tv/js');
          JS
      - name: Flutter prüfen
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  build:
    name: Paket – ${{ matrix.target }}
    needs: [plan, verify]
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: browser
            runner: ubuntu-24.04
          - target: webos
            runner: ubuntu-24.04
          - target: macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: LG-Paketwerkzeug installieren
        if: matrix.target == 'webos'
        run: npm install --global @webos-tools/cli@3.2.6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: matrix.target == 'macos'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Mac-Abhängigkeiten installieren
        if: matrix.target == 'macos'
        run: flutter pub get --enforce-lockfile
      - name: Downloadpaket bauen
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}
        run: sh scripts/build_release_assets.sh "$BUILD_TARGET" "$RELEASE_VERSION" "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.ipk
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: GitHub Release veröffentlichen
    needs: [plan, verify, build]
    if: github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Deutsche Änderungsbeschreibung erstellen
        run: python3 scripts/release.py notes
      - name: Pakete gemeinsam veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
